<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resonance Afterlight Reference Frame</title>
  <style>
    :root {
      --bg: #05090f;
      --ink: #0a111a;
      --panel: rgba(10, 18, 27, 0.84);
      --panel-soft: rgba(14, 26, 38, 0.68);
      --line: rgba(108, 176, 214, 0.44);
      --line-soft: rgba(89, 152, 187, 0.22);
      --cyan: #67e7ff;
      --cyan-2: #44d6e8;
      --teal: #49f0d0;
      --white: #e9f4ff;
      --muted: #8ea5b8;
      --gold: #f6c56d;
      --violet: #9a7cff;
      --shadow: rgba(0, 0, 0, 0.62);
      --font: "Avenir Next", "DIN Alternate", "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 4%, rgba(74, 216, 240, 0.18), transparent 28%),
        radial-gradient(circle at 85% 92%, rgba(246, 197, 109, 0.1), transparent 24%),
        #02060b;
      color: var(--white);
      font-family: var(--font);
    }

    .frame {
      position: relative;
      width: min(100vw, 160vh);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(11, 19, 28, 0.95), rgba(3, 8, 13, 0.98)),
        var(--bg);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.72);
      isolation: isolate;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 20;
    }

    .frame::before {
      inset: 0;
      border: 1px solid rgba(105, 185, 226, 0.58);
      box-shadow:
        inset 0 0 0 2px rgba(81, 149, 188, 0.12),
        inset 0 0 42px rgba(72, 185, 227, 0.07);
    }

    .frame::after {
      inset: 7px;
      border: 1px solid rgba(104, 175, 214, 0.23);
      box-shadow:
        inset 0 0 24px rgba(78, 207, 231, 0.05),
        0 0 18px rgba(78, 207, 231, 0.05);
    }

    .top-rail {
      position: absolute;
      inset: 0 0 auto;
      height: 43px;
      z-index: 30;
      color: rgba(235, 245, 255, 0.88);
      letter-spacing: 0.58em;
      font: 500 clamp(15px, 1.7vw, 24px)/1 var(--font);
      text-align: center;
      text-transform: uppercase;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, transparent 0 13%, rgba(82, 159, 202, 0.28) 13.1% 13.2%, transparent 13.2% 86.8%, rgba(82, 159, 202, 0.28) 86.9% 87%, transparent 87%),
        linear-gradient(180deg, rgba(5, 10, 16, 0.9), rgba(3, 8, 14, 0.2));
      text-shadow: 0 0 16px rgba(126, 224, 255, 0.32);
    }

    .top-rail::before,
    .top-rail::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 34%;
      height: 1px;
      background:
        linear-gradient(90deg, transparent, rgba(113, 190, 228, 0.6), rgba(113, 190, 228, 0.12));
      box-shadow: 0 8px 0 rgba(113, 190, 228, 0.14);
    }

    .top-rail::before { left: 14px; }
    .top-rail::after {
      right: 14px;
      transform: scaleX(-1);
    }

    .top-gem {
      position: absolute;
      left: 50%;
      top: 25px;
      width: 8px;
      height: 8px;
      z-index: 31;
      transform: translateX(-50%) rotate(45deg);
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan), 0 0 42px rgba(103, 231, 255, 0.42);
    }

    .main-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 36px;
      bottom: 205px;
      display: grid;
      grid-template-columns: 33.8% 66.2%;
      border-top: 1px solid rgba(83, 156, 197, 0.28);
      border-bottom: 1px solid rgba(83, 156, 197, 0.42);
      background: #050a11;
      z-index: 3;
    }

    .portrait {
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(111, 178, 216, 0.42);
      background:
        radial-gradient(circle at 40% 98%, rgba(239, 244, 255, 0.34), transparent 30%),
        radial-gradient(circle at 28% 34%, rgba(89, 192, 220, 0.13), transparent 24%),
        linear-gradient(180deg, #07101a 0%, #09111a 58%, #151d28 100%);
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(218, 244, 255, 0.62) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(103, 231, 255, 0.38) 0 1px, transparent 1.2px);
      background-size: 78px 82px, 119px 112px;
      background-position: 16px 36px, 44px 12px;
      opacity: 0.36;
    }

    .portrait::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: 0;
      height: 16%;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(242, 247, 255, 0.72), transparent 56%),
        linear-gradient(180deg, transparent, rgba(234, 240, 250, 0.22));
      filter: blur(0.2px);
    }

    .character-svg {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 91%;
      height: 93%;
      transform: translateX(-50%);
      filter:
        drop-shadow(0 22px 26px rgba(0, 0, 0, 0.62))
        drop-shadow(0 0 21px rgba(165, 218, 255, 0.18));
      z-index: 5;
    }

    .character-svg > :not(defs):not(.hero-v2) { display: none; }

    .scene {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(4, 10, 18, 0.16), rgba(3, 7, 12, 0.76) 73%, rgba(2, 5, 9, 0.98)),
        radial-gradient(circle at 62% 76%, rgba(246, 197, 109, 0.36), transparent 12%),
        radial-gradient(circle at 60% 42%, rgba(58, 192, 236, 0.16), transparent 30%),
        linear-gradient(180deg, #132235 0%, #0c1725 45%, #08101a 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 62% 8%, rgba(244, 249, 255, 0.78), rgba(217, 231, 245, 0.3) 1.8%, transparent 2.7%),
        radial-gradient(circle at 61.5% 7.4%, rgba(255, 255, 255, 0.8), transparent 0.8%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 25%);
      opacity: 0.9;
      z-index: 2;
    }

    .clouds {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 54% 12%, rgba(227, 237, 248, 0.17), transparent 16%),
        radial-gradient(ellipse at 74% 17%, rgba(202, 218, 235, 0.11), transparent 18%),
        radial-gradient(ellipse at 37% 11%, rgba(202, 218, 235, 0.1), transparent 20%);
      filter: blur(1.5px);
      z-index: 1;
    }

    .spectral-ring {
      position: absolute;
      left: 42%;
      top: 24%;
      width: 36%;
      aspect-ratio: 1 / 0.28;
      border: 2px solid rgba(103, 231, 255, 0.42);
      border-radius: 50%;
      transform: rotate(-3deg);
      z-index: 8;
      box-shadow:
        0 0 16px rgba(103, 231, 255, 0.44),
        inset 0 0 28px rgba(103, 231, 255, 0.18);
    }

    .spectral-ring::before,
    .spectral-ring::after {
      content: "";
      position: absolute;
      inset: -6px 8px;
      border-top: 1px dashed rgba(103, 231, 255, 0.54);
      border-radius: 50%;
      filter: blur(0.2px);
    }

    .spectral-ring::after {
      inset: 7px 34px;
      opacity: 0.38;
    }

    .rain {
      position: absolute;
      inset: 0;
      z-index: 7;
      background:
        linear-gradient(180deg, transparent, rgba(103, 231, 255, 0.42), transparent),
        linear-gradient(180deg, transparent, rgba(103, 231, 255, 0.3), transparent),
        linear-gradient(180deg, transparent, rgba(103, 231, 255, 0.24), transparent);
      background-size: 1px 260px, 1px 330px, 1px 420px;
      background-position: 18% 0, 47% 28px, 76% 56px;
      background-repeat: repeat-x;
      opacity: 0.46;
      mix-blend-mode: screen;
    }

    .bridge {
      position: absolute;
      left: -7%;
      top: 13%;
      width: 62%;
      height: 31%;
      transform: rotate(8deg);
      z-index: 11;
      transform-origin: 0 50%;
      border-bottom: 26px solid rgba(28, 33, 38, 0.86);
      border-top: 3px solid rgba(147, 161, 176, 0.22);
      background:
        repeating-linear-gradient(90deg, rgba(225, 238, 247, 0.11) 0 1px, transparent 1px 54px),
        linear-gradient(180deg, rgba(53, 60, 68, 0.66), rgba(12, 17, 23, 0.86));
      box-shadow:
        0 20px 34px rgba(0, 0, 0, 0.5),
        inset 0 -20px 20px rgba(0, 0, 0, 0.38);
    }

    .bridge::before {
      content: "";
      position: absolute;
      left: 6%;
      right: 3%;
      top: 14px;
      height: 10px;
      background:
        repeating-linear-gradient(90deg, rgba(151, 164, 178, 0.32) 0 2px, transparent 2px 28px),
        rgba(12, 16, 21, 0.78);
    }

    .bridge::after {
      content: "";
      position: absolute;
      left: 22%;
      top: 30%;
      width: 9px;
      height: 72%;
      background: linear-gradient(180deg, rgba(86, 104, 120, 0.64), rgba(10, 13, 18, 0.94));
      box-shadow:
        96px 15px 0 rgba(14, 19, 25, 0.86),
        198px 30px 0 rgba(11, 17, 23, 0.9),
        310px 44px 0 rgba(11, 17, 23, 0.92);
    }

    .city {
      position: absolute;
      inset: 8% 0 24%;
      z-index: 5;
    }

    .tower {
      position: absolute;
      bottom: 0;
      left: var(--x);
      width: var(--w);
      height: var(--h);
      border-left: 1px solid rgba(118, 164, 196, 0.18);
      border-right: 1px solid rgba(118, 164, 196, 0.1);
      background:
        repeating-linear-gradient(180deg, rgba(246, 197, 109, 0.16) 0 2px, transparent 2px 31px),
        repeating-linear-gradient(90deg, rgba(103, 231, 255, 0.08) 0 1px, transparent 1px 18px),
        linear-gradient(180deg, rgba(29, 46, 64, 0.82), rgba(8, 13, 19, 0.94));
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.45);
      opacity: var(--o);
    }

    .tower::before {
      content: "";
      position: absolute;
      left: 44%;
      top: -70px;
      width: 2px;
      height: 80px;
      background: linear-gradient(transparent, rgba(103, 231, 255, 0.65));
      box-shadow: 0 0 15px rgba(103, 231, 255, 0.44);
    }

    .foreground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 31%;
      z-index: 13;
      background:
        radial-gradient(ellipse at 61% 8%, rgba(252, 208, 132, 0.64), transparent 9%),
        radial-gradient(ellipse at 61% 16%, rgba(255, 248, 224, 0.26), transparent 18%),
        linear-gradient(180deg, transparent, rgba(3, 7, 11, 0.82) 46%, #03070b 100%);
    }

    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      z-index: 12;
      background:
        repeating-linear-gradient(178deg, transparent 0 21px, rgba(114, 201, 233, 0.15) 22px 23px),
        radial-gradient(ellipse at 61% 31%, rgba(252, 217, 154, 0.34), transparent 21%),
        linear-gradient(180deg, rgba(14, 25, 35, 0.08), rgba(6, 12, 18, 0.92));
    }

    .water::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 34%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(234, 246, 255, 0.55), rgba(246, 197, 109, 0.55), transparent);
      box-shadow:
        0 26px 0 rgba(103, 231, 255, 0.2),
        0 52px 0 rgba(246, 197, 109, 0.16),
        0 78px 0 rgba(103, 231, 255, 0.12);
    }

    .plants {
      position: absolute;
      inset: auto 0 0;
      height: 29%;
      z-index: 16;
      pointer-events: none;
    }

    .plant {
      position: absolute;
      bottom: -4px;
      left: var(--x);
      width: var(--w);
      height: var(--h);
      opacity: var(--o);
    }

    .plant::before,
    .plant::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      border-radius: 100%;
      background: linear-gradient(to top, rgba(58, 83, 65, 0.92), rgba(235, 245, 255, 0.72));
      transform: rotate(var(--r));
      box-shadow:
        -12px -26px 0 -2px rgba(239, 247, 255, 0.7),
        15px -48px 0 -2px rgba(239, 247, 255, 0.46),
        26px -18px 0 -2px rgba(246, 197, 109, 0.38);
    }

    .plant::after {
      transform: rotate(calc(var(--r) * -0.8));
      opacity: 0.65;
    }

    .panel-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 204px;
      z-index: 6;
      display: grid;
      grid-template-columns: 12% 12% 11% 20% 15.5% 8.5% 8.5% 8.5%;
      gap: 17px;
      padding: 19px 18px 17px;
      background:
        linear-gradient(180deg, rgba(2, 7, 12, 0.36), rgba(4, 10, 16, 0.98) 22%),
        #050a10;
      border-top: 1px solid rgba(95, 165, 205, 0.42);
    }

    .hud-card {
      position: relative;
      height: 100%;
      border: 1px solid rgba(96, 179, 213, 0.48);
      background:
        linear-gradient(135deg, rgba(77, 138, 174, 0.2), transparent 36%),
        radial-gradient(circle at 42% 50%, rgba(103, 231, 255, 0.08), transparent 34%),
        rgba(10, 18, 27, 0.86);
      box-shadow:
        inset 0 0 0 2px rgba(80, 151, 185, 0.08),
        inset 0 0 28px rgba(74, 185, 227, 0.05),
        0 0 20px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .hud-card::before,
    .hud-card::after {
      content: "";
      position: absolute;
      width: 40px;
      height: 28px;
      border-color: rgba(104, 218, 238, 0.78);
      pointer-events: none;
    }

    .hud-card::before {
      left: 8px;
      top: 8px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .hud-card::after {
      right: 8px;
      bottom: 8px;
      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    .hud-card.dim {
      border-color: rgba(101, 154, 189, 0.36);
      opacity: 0.84;
    }

    .hud-card.violet {
      border-color: rgba(154, 124, 255, 0.7);
      box-shadow: inset 0 0 0 2px rgba(154, 124, 255, 0.08), 0 0 22px rgba(154, 124, 255, 0.08);
    }

    .hud-card.gold {
      border-color: rgba(246, 197, 109, 0.86);
      box-shadow:
        inset 0 0 0 2px rgba(246, 197, 109, 0.12),
        0 0 30px rgba(246, 197, 109, 0.24);
    }

    .hud-card.gold::before,
    .hud-card.gold::after {
      border-color: rgba(246, 197, 109, 0.92);
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(118, 180, 214, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 180, 214, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.55;
    }

    .diag {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, transparent 0 46%, rgba(165, 221, 255, 0.22) 46.4% 47%, transparent 47.4%);
    }

    .radar {
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      border: 1px solid rgba(103, 231, 255, 0.24);
      box-shadow:
        inset 0 0 0 32px rgba(103, 231, 255, 0.02),
        inset 0 0 0 64px rgba(103, 231, 255, 0.025);
    }

    .radar::before {
      content: "";
      position: absolute;
      inset: 44%;
      background: var(--cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 24px var(--cyan);
    }

    .wave,
    .audio {
      position: absolute;
      inset: 22px 18px;
    }

    .wave svg,
    .audio svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .slot-glow {
      position: absolute;
      inset: -24px -16px auto auto;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(246, 197, 109, 0.85), transparent 60%);
      filter: blur(8px);
      opacity: 0.64;
    }

    .micro-lines {
      position: absolute;
      inset: 12px;
      border-top: 1px solid rgba(130, 216, 238, 0.2);
      border-left: 1px solid rgba(130, 216, 238, 0.16);
      opacity: 0.8;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0.018;
      mix-blend-mode: screen;
      background-image:
        repeating-radial-gradient(circle at 11% 17%, #fff 0 1px, transparent 1px 3px),
        repeating-linear-gradient(115deg, transparent 0 6px, rgba(255, 255, 255, 0.3) 6px 7px);
      background-size: 180px 180px, 220px 220px;
    }
  </style>
</head>

    <span class="top-gem"></span>
