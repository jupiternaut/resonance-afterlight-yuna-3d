<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resonance Afterlight Character Roster WebGL</title>
  <style>
    :root {
      --cyan: #62e8ff;
      --teal: #48f0d0;
      --gold: #f3c064;
      --violet: #9b7cff;
      --white: #edf7ff;
      --font: "Avenir Next", "DIN Alternate", "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(38, 83, 105, 0.2), transparent 34%),
        #010409;
      color: var(--white);
      font-family: var(--font);
    }

    body {
      display: grid;
      place-items: center;
    }

    .board {
      position: relative;
      width: min(100vw, 133.333vh);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #03070d;
      box-shadow: 0 30px 110px rgba(0, 0, 0, 0.76);
      isolation: isolate;
    }

    #three-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #03070d;
    }

    .frame,
    .grid-grain,
    .top,
    .gem,
    .split-line,
    .roster,
    .identity {
      position: absolute;
    }

    .frame {
      inset: 0;
      z-index: 40;
      pointer-events: none;
      border: 1px solid rgba(101, 179, 220, 0.72);
      box-shadow:
        inset 0 0 0 2px rgba(81, 166, 210, 0.15),
        inset 0 0 46px rgba(84, 215, 245, 0.08);
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .frame::before {
      inset: 8px;
      border: 1px solid rgba(104, 180, 220, 0.3);
      clip-path: polygon(0 20px, 20px 0, 31% 0, 32% 12px, 68% 12px, 69% 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
    }

    .frame::after {
      left: 0;
      right: 0;
      top: 79.6%;
      height: 1px;
      background: rgba(100, 181, 222, 0.62);
      box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    .top {
      inset: 0 0 auto;
      height: 3.05%;
      z-index: 45;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0.63em;
      font: 500 clamp(16px, 1.65vw, 25px)/1 var(--font);
      color: rgba(238, 248, 255, 0.95);
      text-shadow: 0 0 18px rgba(100, 226, 255, 0.34);
      background:
        linear-gradient(90deg, transparent 0 13.5%, rgba(103, 231, 255, 0.35) 13.6% 13.7%, transparent 13.8% 86.2%, rgba(103, 231, 255, 0.34) 86.3% 86.4%, transparent 86.5%),
        linear-gradient(180deg, rgba(2, 6, 12, 0.96), rgba(2, 6, 12, 0.12));
    }

    .top::before,
    .top::after {
      content: "";
      position: absolute;
      top: 14px;
      width: 36%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(128, 203, 238, 0.65), rgba(128, 203, 238, 0.15));
      box-shadow: 0 10px 0 rgba(128, 203, 238, 0.16);
    }

    .top::before { left: 15px; }
    .top::after {
      right: 15px;
      transform: scaleX(-1);
    }

    .gem {
      top: 3.05%;
      left: 50%;
      z-index: 46;
      width: 9px;
      height: 9px;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan), 0 0 44px rgba(98, 232, 255, 0.5);
    }

    .split-line {
      left: 33.82%;
      top: 3.05%;
      bottom: 20.4%;
      z-index: 35;
      width: 1px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(123, 190, 224, 0.42), rgba(123, 190, 224, 0.66), rgba(123, 190, 224, 0.2));
      box-shadow: 0 0 20px rgba(98, 232, 255, 0.12);
    }

    .grid-grain {
      inset: 0;
      z-index: 38;
      pointer-events: none;
      opacity: 0.014;
      mix-blend-mode: screen;
      background-image:
        repeating-radial-gradient(circle at 18% 22%, #fff 0 1px, transparent 1px 4px),
        repeating-linear-gradient(115deg, transparent 0 6px, rgba(255, 255, 255, 0.28) 6px 7px);
      background-size: 220px 220px, 260px 260px;
    }

    .identity {
      right: 2.1%;
      top: 7.2%;
      z-index: 32;
      width: 23%;
      min-width: 230px;
      pointer-events: none;
      text-align: right;
    }

    .identity .name {
      letter-spacing: 0.38em;
      font-size: clamp(22px, 2.4vw, 40px);
      font-weight: 500;
      line-height: 1;
      color: rgba(237, 247, 255, 0.96);
      text-shadow: 0 0 22px rgba(98, 232, 255, 0.28);
    }

    .identity .role {
      margin-top: 10px;
      letter-spacing: 0.22em;
      font-size: clamp(10px, 0.9vw, 14px);
      color: rgba(143, 203, 224, 0.78);
      text-transform: uppercase;
    }

    .identity .line {
      height: 1px;
      margin-top: 14px;
      background: linear-gradient(90deg, transparent, rgba(98, 232, 255, 0.72));
      box-shadow: 0 0 12px rgba(98, 232, 255, 0.22);
    }

    .roster {
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 34;
      height: 20.4%;
      padding: 1.12% 0.9% 0.78%;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 0.72%;
      background:
        linear-gradient(180deg, rgba(2, 7, 13, 0.22), rgba(3, 8, 14, 0.96) 22%),
        rgba(5, 10, 17, 0.82);
      transform-origin: 50% 100%;
      transform: perspective(1100px) rotateX(7deg);
      border-top: 1px solid rgba(100, 181, 222, 0.54);
    }

    .character-card {
      position: relative;
      min-width: 0;
      height: 100%;
      padding: 7px 7px 6px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(105, 185, 224, 0.5);
      background:
        linear-gradient(135deg, rgba(91, 146, 177, 0.18), transparent 34%),
        radial-gradient(circle at 50% 38%, rgba(98, 232, 255, 0.08), transparent 42%),
        rgba(8, 17, 27, 0.72);
      box-shadow:
        inset 0 0 0 2px rgba(92, 165, 205, 0.1),
        inset 0 0 30px rgba(86, 215, 244, 0.05),
        0 16px 34px rgba(0, 0, 0, 0.34);
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      transition: border-color 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .character-card::before,
    .character-card::after {
      content: "";
      position: absolute;
      width: 28%;
      height: 20%;
      border-color: rgba(132, 226, 246, 0.72);
      z-index: 3;
      pointer-events: none;
    }

    .character-card::before {
      left: 7%;
      top: 7%;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .character-card::after {
      right: 7%;
      bottom: 7%;
      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    .character-card:hover {
      border-color: rgba(98, 232, 255, 0.85);
      filter: brightness(1.12);
    }

    .character-card.active {
      border-color: rgba(243, 192, 100, 0.94);
      box-shadow:
        inset 0 0 0 2px rgba(243, 192, 100, 0.14),
        0 0 28px rgba(243, 192, 100, 0.2);
    }

    .character-card.active::before,
    .character-card.active::after {
      border-color: rgba(243, 192, 100, 0.96);
    }

    .card-grid {
      position: absolute;
      inset: 0;
      opacity: 0.58;
      background-image:
        linear-gradient(rgba(116, 185, 220, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(116, 185, 220, 0.08) 1px, transparent 1px);
      background-size: 21px 21px;
    }

    .portrait {
      position: absolute;
      left: 50%;
      bottom: 10%;
      z-index: 2;
      width: 84%;
      height: 82%;
      transform: translateX(-50%);
      object-fit: contain;
      object-position: 50% 100%;
      filter:
        drop-shadow(0 10px 14px rgba(0, 0, 0, 0.58))
        drop-shadow(0 0 8px rgba(98, 232, 255, 0.12));
    }

    .card-copy {
      position: absolute;
      left: 9%;
      right: 8%;
      bottom: 8%;
      z-index: 4;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      color: rgba(237, 247, 255, 0.88);
      text-transform: uppercase;
    }

    .card-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      letter-spacing: 0.16em;
      font-size: clamp(8px, 0.67vw, 12px);
    }

    .card-index {
      color: rgba(98, 232, 255, 0.74);
      font-size: clamp(8px, 0.62vw, 11px);
    }

    @media (max-width: 900px) {
      .top {
        font-size: 15px;
        letter-spacing: 0.36em;
      }

      .identity {
        top: 6%;
        width: 36%;
        min-width: 0;
      }

      .roster {
        gap: 0.45%;
        padding-inline: 0.6%;
      }

      .card-name {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="board" id="board" aria-label="Resonance Afterlight multi-character WebGL stage">
    <canvas id="three-stage"></canvas>
    <div class="frame"></div>
    <header class="top">Resonance Afterlight</header>
    <span class="gem"></span>
    <span class="split-line"></span>
    <div class="grid-grain"></div>

    <section class="identity" aria-live="polite">
      <div class="name" id="active-name">IRIS</div>
      <div class="role" id="active-role">Support Resonator</div>
      <div class="line"></div>
    </section>

    <nav class="roster" id="roster" aria-label="Character roster"></nav>
  </main>

  <script src="assets/generated/asset-data.js"></script>
  <script src="assets/generated/character-roster-data.js"></script>
  <script src="assets/vendor/three.r128.min.js"></script>
  <script>
    const THREE = window.THREE;
    const rosterData = window.RA_CHARACTER_ROSTER || [];
    const board = document.getElementById("board");
    const roster = document.getElementById("roster");
    const activeName = document.getElementById("active-name");
    const activeRole = document.getElementById("active-role");
    const canvas = document.getElementById("three-stage");

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: false,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setClearColor(0x03070d, 1);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06111a, 0.035);

    const camera = new THREE.PerspectiveCamera(34, 4 / 3, 0.1, 80);
    camera.position.set(0, 0.35, 19.8);

    const stage = new THREE.Group();
    scene.add(stage);

    const loader = new THREE.TextureLoader();
    const pointer = { x: 0, y: 0 };
    const target = { x: 0, y: 0 };
    const tracked = [];
    const characterTextures = [];
    let activeIndex = Math.min(1, Math.max(0, rosterData.length - 1));
    let characterMesh = null;
    let characterMaterial = null;
    let haloMesh = null;

    function loadTexture(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, (texture) => {
          texture.encoding = THREE.sRGBEncoding;
          texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
          texture.needsUpdate = true;
          resolve(texture);
        }, undefined, reject);
      });
    }

    function makeGradientTexture(kind) {
      const c = document.createElement("canvas");
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext("2d");
      const bg = ctx.createLinearGradient(0, 0, 0, c.height);
      bg.addColorStop(0, "#07111b");
      bg.addColorStop(0.55, "#07101a");
      bg.addColorStop(1, "#151e28");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, c.width, c.height);

      if (kind === "left") {
        const foot = ctx.createRadialGradient(460, 970, 10, 460, 970, 520);
        foot.addColorStop(0, "rgba(255,255,255,0.78)");
        foot.addColorStop(0.24, "rgba(190,208,226,0.22)");
        foot.addColorStop(0.64, "rgba(0,0,0,0)");
        ctx.fillStyle = foot;
        ctx.fillRect(0, 0, c.width, c.height);

        const aura = ctx.createRadialGradient(440, 310, 10, 440, 310, 360);
        aura.addColorStop(0, "rgba(82,223,246,0.18)");
        aura.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = aura;
        ctx.fillRect(0, 0, c.width, c.height);
      }

      const texture = new THREE.CanvasTexture(c);
      texture.encoding = THREE.sRGBEncoding;
      texture.needsUpdate = true;
      return texture;
    }

    function makePlane({ width, height, texture, x, y, z, opacity = 1, rotationY = 0, rotationX = 0, color = 0xffffff }) {
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        color,
        transparent: opacity < 1 || Boolean(texture),
        opacity,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height, 1, 1), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotationX, rotationY, 0);
      stage.add(mesh);
      return mesh;
    }

    function seeded(seed) {
      let value = seed % 2147483647;
      return () => {
        value = value * 16807 % 2147483647;
        return (value - 1) / 2147483646;
      };
    }

    function addLine(x1, y1, z1, x2, y2, z2, color, opacity) {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1, y1, z1),
        new THREE.Vector3(x2, y2, z2)
      ]);
      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const line = new THREE.Line(geometry, material);
      stage.add(line);
      return line;
    }

    function addRing() {
      const curve = new THREE.EllipseCurve(0, 0, 1.95, 0.52, 0, Math.PI * 2, false, 0);
      const points = curve.getPoints(180).map((p) => new THREE.Vector3(p.x, p.y, 0));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const ring = new THREE.LineLoop(
        geometry,
        new THREE.LineBasicMaterial({
          color: 0x62e8ff,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      ring.position.set(4.95, 3.42, 0.52);
      ring.rotation.set(0.1, -0.08, -0.02);
      stage.add(ring);
      return ring;
    }

    function addParticles() {
      const random = seeded(42691);
      const count = 460;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < count; i += 1) {
        const panelBias = random();
        const x = panelBias < 0.33 ? -7.2 + random() * 5 : -1.8 + random() * 9.5;
        const y = -4.2 + random() * 8.6;
        const z = -0.55 + random() * 3.5;
        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const warm = random() > 0.91;
        color.set(warm ? 0xf3c064 : (random() > 0.68 ? 0xedf7ff : 0x62e8ff));
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.82,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const points = new THREE.Points(geometry, material);
      stage.add(points);
      return points;
    }

    function addHudDepthLines() {
      for (let i = 0; i < 15; i += 1) {
        const x = -8 + i * 1.14;
        addLine(x, -3.42, -0.15, x + 0.42, -5.58, 0.8, 0x315d75, 0.16);
      }
      addLine(-8, -3.35, 0.12, 8, -3.35, 0.12, 0x62e8ff, 0.34);
    }

    function makeRosterCards() {
      roster.innerHTML = "";
      for (const [index, item] of rosterData.entries()) {
        const button = document.createElement("button");
        button.className = "character-card";
        button.type = "button";
        button.dataset.index = String(index);
        button.setAttribute("aria-label", item.name);
        button.innerHTML = `
          <span class="card-grid"></span>
          <img class="portrait" alt="" src="${item.image}">
          <span class="card-copy">
            <span class="card-name">${item.name}</span>
            <span class="card-index">${String(index + 1).padStart(2, "0")}</span>
          </span>
        `;
        button.addEventListener("click", () => setActive(index));
        roster.appendChild(button);
      }
    }

    function fitCharacter(texture) {
      const image = texture.image || {};
      const aspect = image.width && image.height ? image.width / image.height : 0.54;
      const maxWidth = 5.18;
      const maxHeight = 8.55;
      let height = maxHeight;
      let width = height * aspect;
      if (width > maxWidth) {
        width = maxWidth;
        height = width / aspect;
      }
      return { width, height };
    }

    function setActive(index) {
      if (!characterMesh || !characterTextures[index]) return;
      activeIndex = index;
      const texture = characterTextures[index];
      const fit = fitCharacter(texture);
      characterMesh.geometry.dispose();
      characterMesh.geometry = new THREE.PlaneGeometry(fit.width, fit.height, 1, 1);
      characterMaterial.map = texture;
      characterMaterial.needsUpdate = true;
      const isWide = fit.width > 5.25;
      characterMesh.position.x = isWide ? -5.25 : -5.12;
      characterMesh.position.y = 1.12;
      characterMesh.userData.baseX = characterMesh.position.x;
      characterMesh.userData.baseY = characterMesh.position.y;

      const item = rosterData[index];
      activeName.textContent = item.name;
      activeRole.textContent = item.role;
      for (const card of roster.querySelectorAll(".character-card")) {
        card.classList.toggle("active", Number(card.dataset.index) === index);
      }
    }

    Promise.all([
      loadTexture(window.RA_ASSETS.city),
      ...rosterData.map((item) => loadTexture(item.image))
    ]).then(([cityTexture, ...loadedCharacters]) => {
      characterTextures.push(...loadedCharacters);
      makeRosterCards();

      makePlane({
        width: 16,
        height: 12,
        texture: null,
        x: 0,
        y: 0,
        z: -2.7,
        opacity: 1,
        color: 0x03070d
      });

      const leftPane = makePlane({
        width: 5.45,
        height: 9.22,
        texture: makeGradientTexture("left"),
        x: -5.29,
        y: 0.97,
        z: -1.0,
        opacity: 1
      });
      leftPane.rotation.y = 0.035;

      const city = makePlane({
        width: 11.7,
        height: 9.82,
        texture: cityTexture,
        x: 2.85,
        y: 0.92,
        z: -1.35,
        opacity: 1
      });
      city.rotation.y = -0.055;
      city.material.color.set(0xd6e8ff);

      const haze = makePlane({
        width: 11.72,
        height: 9.84,
        texture: makeGradientTexture("haze"),
        x: 2.85,
        y: 0.92,
        z: -0.78,
        opacity: 0.18,
        color: 0x6ccaff
      });
      haze.material.blending = THREE.AdditiveBlending;

      characterMaterial = new THREE.MeshBasicMaterial({
        map: characterTextures[activeIndex],
        transparent: true,
        opacity: 1,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const fit = fitCharacter(characterTextures[activeIndex]);
      characterMesh = new THREE.Mesh(new THREE.PlaneGeometry(fit.width, fit.height, 1, 1), characterMaterial);
      characterMesh.position.set(-5.15, 1.12, 0.64);
      characterMesh.rotation.y = 0.05;
      stage.add(characterMesh);

      haloMesh = makePlane({
        width: 4.4,
        height: 1.3,
        texture: makeGradientTexture("left"),
        x: -5.16,
        y: -4.52,
        z: 0.06,
        opacity: 0.2,
        rotationX: -0.72,
        color: 0xbfd8ee
      });
      haloMesh.material.blending = THREE.AdditiveBlending;

      const ring = addRing();
      const particles = addParticles();
      addHudDepthLines();

      const random = seeded(9811);
      for (let i = 0; i < 54; i += 1) {
        const x = -1.15 + random() * 8.8;
        const y = 1.15 + random() * 3.8;
        const length = 0.35 + random() * 1.45;
        addLine(x, y, 0.34 + random() * 0.9, x, y - length, 0.34 + random() * 0.9, 0x62e8ff, 0.13 + random() * 0.3);
      }

      tracked.push({ mesh: city, factor: 0.16 });
      tracked.push({ mesh: haze, factor: 0.1 });
      tracked.push({ mesh: characterMesh, factor: 0.34 });
      tracked.push({ mesh: ring, factor: 0.22 });
      tracked.push({ mesh: particles, factor: 0.45 });
      tracked.push({ mesh: haloMesh, factor: 0.2 });

      setActive(activeIndex);
      start();
    }).catch((error) => {
      console.error(error);
      document.body.dataset.webglError = "true";
    });

    function resize() {
      const rect = board.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }

    function renderAt(time) {
      target.x += (pointer.x - target.x) * 0.07;
      target.y += (pointer.y - target.y) * 0.07;

      stage.rotation.y = target.x * 0.035;
      stage.rotation.x = -target.y * 0.018;
      camera.position.x = target.x * 0.52;
      camera.position.y = 0.35 + target.y * 0.18 + Math.sin(time * 0.45) * 0.035;
      camera.lookAt(0.05, 0.25, 0);

      for (const { mesh, factor } of tracked) {
        mesh.position.x += (mesh.userData.baseX + target.x * factor - mesh.position.x) * 0.08;
        mesh.position.y += (mesh.userData.baseY + target.y * factor * 0.34 - mesh.position.y) * 0.08;
      }

      const ring = tracked[3]?.mesh;
      if (ring) {
        ring.scale.setScalar(1 + Math.sin(time * 1.35) * 0.035);
        ring.material.opacity = 0.55 + Math.sin(time * 1.8) * 0.12;
      }

      const particles = tracked[4]?.mesh;
      if (particles) {
        particles.rotation.z = Math.sin(time * 0.14) * 0.012;
        particles.rotation.y = target.x * 0.025;
      }

      renderer.render(scene, camera);
    }

    function start() {
      resize();
      for (const item of tracked) {
        item.mesh.userData.baseX = item.mesh.position.x;
        item.mesh.userData.baseY = item.mesh.position.y;
      }

      const startTime = performance.now();
      const tick = () => {
        renderAt((performance.now() - startTime) / 1000);
        requestAnimationFrame(tick);
      };
      tick();
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (event) => {
      const rect = board.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
      pointer.y = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
    });

    window.addEventListener("pointerleave", () => {
      pointer.x = 0;
      pointer.y = 0;
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") setActive((activeIndex + 1) % rosterData.length);
      if (event.key === "ArrowLeft") setActive((activeIndex - 1 + rosterData.length) % rosterData.length);
    });

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });
  </script>
</body>
</html>
